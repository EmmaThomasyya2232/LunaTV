services:
  moontv-core:
    build:
      context: .
      dockerfile: Dockerfile
    image: lunatv:local
    container_name: moontv-core
    restart: on-failure
    ports:
      - '3000:3000'
    environment:
      # 站长账号（请修改为强密码）
      - USERNAME=admin
      - PASSWORD=admin
      # 存储类型：kvrocks（推荐，见 README）
      - NEXT_PUBLIC_STORAGE_TYPE=kvrocks
      - KVROCKS_URL=redis://moontv-kvrocks:6666
      # 站点名称（可选）
      - NEXT_PUBLIC_SITE_NAME=LunaTV
    networks:
      - moontv-network
    depends_on:
      moontv-kvrocks:
        condition: service_healthy

  moontv-kvrocks:
    image: apache/kvrocks
    container_name: moontv-kvrocks
    restart: unless-stopped
    volumes:
      - kvrocks-data:/var/lib/kvrocks
    networks:
      - moontv-network
    healthcheck:
      test: ['CMD', 'redis-cli', '-p', '6666', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  moontv-network:
    driver: bridge

volumes:
  kvrocks-data:
