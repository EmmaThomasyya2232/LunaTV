services:
  kvrocks:
    image: apache/kvrocks
    container_name: lunatv-kvrocks
    volumes:
      - kvrocks-data:/var/lib/kvrocks
    healthcheck:
      test: ['CMD', 'redis-cli', '-p', '6666', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lunatv-app
    ports:
      - '3000:3000'
    depends_on:
      kvrocks:
        condition: service_healthy
    environment:
      # 存储类型：使用 Kvrocks
      - NEXT_PUBLIC_STORAGE_TYPE=kvrocks
      # Kvrocks 连接地址（容器内通过 service name 访问）
      - KVROCKS_URL=redis://kvrocks:6666
      # 站长账号
      - USERNAME=admin
      # 站长密码
      - PASSWORD=admin123
      # 站点名称（可选）
      - NEXT_PUBLIC_SITE_NAME=MoonTV

volumes:
  kvrocks-data:
